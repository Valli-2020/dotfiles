# UTF-8 support
set-option -g default-terminal "tmux-256color"
set-option -g terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Truecolor: outer terminal (Ghostty) has RGB above; tell programs inside tmux
set-environment -g COLORTERM truecolor

# Ensure locale is passed through
set-option -ga update-environment "LANG LC_ALL LC_CTYPE"
